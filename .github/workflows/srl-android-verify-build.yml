name: Sandbox Reply Lab Android APK

on:
  push:
    branches: [feature/srl-android-build]
    paths:
      - 'apps/sandbox-reply-lab/**'
      - '.github/workflows/srl-android-verify-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and unpack exact source snapshot
        run: |
          echo "4d8ff944f4798f972af78de35c6d17edac2c4f6482e2444e475064fa82e7b461  apps/sandbox-reply-lab/source.tar.xz" | sha256sum --check
          mkdir -p .srl-src
          tar -xJf apps/sandbox-reply-lab/source.tar.xz -C .srl-src
      - name: Prepare Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK
        run: gradle -p .srl-src :app:assembleDebug --stacktrace --no-daemon
      - name: Check APK contents
        run: |
          test -s .srl-src/app/build/outputs/apk/debug/app-debug.apk
          unzip -t .srl-src/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          sha256sum .srl-src/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SandboxReplyLab-v0.5.1-debug-APK
          path: .srl-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
